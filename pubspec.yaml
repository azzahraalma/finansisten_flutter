name: finansisten
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1

  # UI & Utils (sama seperti sebelumnya)
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  image_picker: ^1.1.2
  fl_chart: ^0.68.0
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_native_splash:
  color: "#6DB5FD"
  image: .idea/assets/img/logo.png
  color_dark: "#6DB5FD"
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: ".idea/assets/img/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6DB5FD"
  adaptive_icon_foreground: ".idea/assets/img/logo.png"

flutter:
  uses-material-design: true
  assets:
    - .idea/assets/img/phone.png
    - .idea/assets/img/coin.png
    - .idea/assets/img/logo.png
    - .idea/assets/img/logo_clear.png